<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员后台 - 类目与爆款商品库</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><header class="topbar"><div class="brand"><span class="brandmark">◆</span><div><b>类目与爆款商品库</b><small>ADMIN CONSOLE</small></div></div><div class="top-actions"><span class="live"><i></i> 管理员工作台</span><a class="admin-link" href="/">返回展示页 ↗</a></div></header><main class="admin-wrap"><div class="content-head"><div><div class="eyebrow">CONTENT MANAGEMENT</div><h1>后台管理</h1><p>导入 Excel、上传商品图片、设置优先级和改款标签</p></div></div><section class="panel"><div class="panel-title"><div><h2>① Excel 批量导入</h2><p>支持 .xlsx、.xls 文件；按“叶子类目 + 商品名称”匹配更新，未匹配则新增。</p></div><a class="download-link" href="/template.xlsx" download>下载 Excel 模板</a></div><div class="upload-zone"><input id="excelFile" type="file" accept=".xlsx,.xls"><label for="excelFile"><span class="upload-icon">⇧</span><b>选择 Excel 文件</b><small>或点击此处选择本地文件</small></label></div><div id="excelStatus" class="status"></div><button id="importBtn" class="primary-btn" disabled>导入商品数据</button></section><section class="panel"><div class="panel-title"><div><h2>② 商品卡片管理</h2><p>可以单独上传图片、调整优先级、设置改款标签或删除商品。</p></div><button id="reloadAdmin" class="secondary-btn">刷新列表</button></div><div class="admin-tools"><input id="adminSearch" placeholder="搜索商品名称或叶子类目"><span id="adminCount"></span></div><div id="adminList" class="admin-list">正在加载…</div></section><div class="notice">安全提示：请先完成 Cloudflare Access 配置，再把管理员入口分享给管理员。普通访客只访问首页。</div></main><script src="/admin.js"></script></body></html>
