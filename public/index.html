
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>类目与爆款商品管理</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brandmark">◆</span>
    <div>
      <b>类目与爆款商品库</b>
      <small>Category & Best Sellers</small>
    </div>
  </div>
  <div class="top-actions">
    <span class="live"><i></i> 云端实时数据</span>
    <a class="admin-link" href="/admin.html">管理员入口 ↗</a>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <div>
        <b>商品类目</b>
        <small id="categoryCount">正在加载…</small>
      </div>
      <button id="expandAll" class="icon-btn" title="展开全部">＋</button>
    </div>

    <label class="searchbox">
      <span>⌕</span>
      <input id="searchInput" placeholder="搜索类目或商品">
    </label>

    <div id="tree" class="tree">
      <div class="empty">正在加载类目…</div>
    </div>
  </aside>

  <section class="content">
    <div class="content-head">
      <div>
        <div class="eyebrow">PRODUCT LIBRARY</div>
        <h1 id="heading">全部爆款商品</h1>
        <p id="subheading">按类目浏览商品灵感与改款机会</p>
      </div>

      <div class="toolbar">
        <label>
          排序方式
          <select id="sortSelect">
            <option value="priority">优先级</option>
            <option value="updated">更新时间</option>
          </select>
        </label>

        <label>
          业务模式
          <select id="businessModeFilter">
            <option value="">全部</option>
            <option value="全托">全托</option>
            <option value="半托">半托</option>
          </select>
        </label>

        <button class="refresh-btn" id="refreshBtn">↻ 刷新</button>
      </div>
    </div>

    <div class="chips" id="activePath"></div>

    <div class="result-line">
      <span id="resultCount">0 件商品</span>
      <span>数据更新后刷新即可查看最新内容</span>
    </div>

    <div id="cards" class="cards">
      <div class="empty">正在加载商品…</div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
